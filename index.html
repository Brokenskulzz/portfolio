<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon – Anurag Satpathy</title>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }

  .bg-noise {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 70% 45% at 50% 100%, rgba(180,80,10,0.42) 0%, rgba(100,30,0,0.18) 45%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    animation: breathe 6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.04); }
  }

  .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(200,90,20,0.22);
    animation: float linear infinite;
  }

  @keyframes float {
    0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.4; }
    100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .content {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 80px 24px 0;
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    flex: 0 0 auto;
  }

  .hello {
    font-family: 'Gochi Hand', cursive;
    font-size: clamp(72px, 11vw, 112px);
    color: #fff;
    line-height: 1;
    letter-spacing: -1px;
    margin-bottom: 28px;
    animation: slideDown 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bio {
    font-size: clamp(15px, 2.2vw, 20px);
    font-weight: 300;
    color: rgba(255,255,255,0.75);
    line-height: 1.65;
    max-width: 780px;
    margin-bottom: 36px;
    animation: fadeUp 1s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .socials {
    display: flex;
    gap: 18px;
    margin-bottom: 0;
    animation: fadeUp 1s 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .social-btn {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    backdrop-filter: blur(6px);
    cursor: pointer;
  }

  .social-btn:hover {
    transform: translateY(-6px) scale(1.12);
    background: rgba(200,80,10,0.28);
    border-color: rgba(220,100,30,0.5);
    box-shadow: 0 8px 30px rgba(180,70,10,0.35);
  }

  .social-btn svg {
    width: 22px;
    height: 22px;
    fill: rgba(255,255,255,0.85);
    transition: fill 0.2s ease;
  }

  .social-btn:hover svg { fill: #fff; }

  .spacer { flex: 1; min-height: 60px; }

  .avatar-wrap {
    width: 100%;
    max-width: 360px;
    margin: 0 auto;
    animation: fadeUp 1s 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
    flex: 0 0 auto;
    align-self: center;
  }

  /* ============================================
     HOW TO ADD YOUR AVATAR IMAGE:
     1. Export your avatar from Figma as PNG
     2. Go to squoosh.app, convert to WebP, download
     3. Rename the file to: avatar.webp
     4. Put it inside the images/ folder
     5. Delete the <div class="avatar-placeholder"> block below
     6. Uncomment the <img> tag below it
     ============================================ */

  .avatar-placeholder {
    width: 100%;
    aspect-ratio: 340/394;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.03);
    border: 2px dashed rgba(255,255,255,0.12);
    border-radius: 16px;
    gap: 12px;
    color: rgba(255,255,255,0.3);
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
  }

  .avatar-img {
    width: 100%;
    display: block;
    filter: drop-shadow(0 -10px 40px rgba(180,70,10,0.2));
    transition: filter 0.4s ease, transform 0.4s ease;
  }

  .avatar-img:hover {
    filter: drop-shadow(0 -10px 60px rgba(220,100,20,0.45));
    transform: scale(1.03) translateY(-6px);
  }

  @media (max-width: 600px) {
    .avatar-wrap {
      max-width: 220px;
    }
    .content {
      padding: 60px 20px 0;
    }
  }

  .cursor-glow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(180,70,10,0.1) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    transform: translate(-50%, -50%);
    transition: left 0.12s ease, top 0.12s ease;
  }
</style>
</head>
<body>

<div class="bg-noise"></div>
<div class="particles" id="particles"></div>
<div class="cursor-glow" id="cursorGlow"></div>

<div class="page">

  <div class="content">
    <h1 class="hello">Hello!</h1>
    <p class="bio">
      I'm Anurag, a product designer with 8 years of experience balancing human needs, business goals, and scalability. I'm currently redesigning my portfolio. But, you can still view some of my work on Dribbble or if you want to chat, just shoot me an email!
    </p>

    <div class="socials">
      <!-- LinkedIn -->
      <a class="social-btn" href="https://www.linkedin.com/in/anurag-satpathy/" target="_blank" title="LinkedIn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
      </a>
      <!-- Dribbble -->
      <a class="social-btn" href="https://dribbble.com/AnuragSatpathy" target="_blank" title="Dribbble">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 24C5.385 24 0 18.615 0 12S5.385 0 12 0s12 5.385 12 12-5.385 12-12 12zm10.12-10.358c-.35-.11-3.17-.953-6.384-.438 1.34 3.684 1.887 6.684 1.992 7.308a10.16 10.16 0 0 0 4.395-6.87zm-6.115 7.808c-.153-.9-.75-4.032-2.19-7.77l-.066.02c-5.79 2.015-7.86 6.017-8.04 6.4a10.161 10.161 0 0 0 6.29 2.166 10.2 10.2 0 0 0 4.006-.816zm-11.62-2.073c.232-.4 3.045-5.055 8.332-6.765.135-.045.27-.084.405-.12a28.522 28.522 0 0 0-.722-1.448C7.365 8.87 2.244 8.76 1.8 8.744v.362A10.16 10.16 0 0 0 4.384 19.377zm-2.51-8.5c.45.008 4.886.09 9.823-1.299a58.077 58.077 0 0 0-3.93-5.273A10.163 10.163 0 0 0 1.875 10.877zm6.705-8.143a59.013 59.013 0 0 1 3.95 5.298c3.768-1.414 5.365-3.56 5.56-3.83a10.127 10.127 0 0 0-9.51-1.468zm12.07 3.12c-.22.3-1.988 2.573-5.92 4.178.246.507.48 1.02.696 1.535.075.18.148.36.217.54 3.408-.43 6.8.258 7.144.33v-.27a10.163 10.163 0 0 0-2.136-6.312z"/>
        </svg>
      </a>
      <!-- Email -->
      <a class="social-btn" href="mailto:satpathy.anurag007@gmail.com" title="Email">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/>
        </svg>
      </a>
    </div>
  </div>

  <div class="spacer"></div>

  <div class="avatar-wrap">

    <img src="images/avatar.webp" alt="Anurag waving" class="avatar-img">

  </div>

</div>

<script>
  // Floating particles
  const container = document.getElementById('particles');
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 6 + 3;
    p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;animation-duration:${Math.random()*14+10}s;animation-delay:${Math.random()*10}s;`;
    container.appendChild(p);
  }

  // Cursor glow follow
  const glow = document.getElementById('cursorGlow');
  document.addEventListener('mousemove', (e) => {
    glow.style.left = e.clientX + 'px';
    glow.style.top = e.clientY + 'px';
  });
</script>
</body>
</html>
